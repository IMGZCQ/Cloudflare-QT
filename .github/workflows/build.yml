name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v0.3.7)'
        required: true
        type: string
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: true
        type: boolean

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-server:
    name: Server ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BIN="cf-quicktunnel-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            BIN="cf-quicktunnel-server.exe"
          fi
          go build -trimpath -ldflags "-s -w" -o "$BIN" ./cmd/server
          echo "Built: $BIN"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cf-quicktunnel-*
          retention-days: 7

  build-desktop:
    name: Desktop Windows/amd64
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: Generate icon
        run: rsrc -ico CloudflareQT256256.ico -o icon.syso

      - name: Build desktop
        env:
          CGO_ENABLED: 0
        run: |
          go build -tags "desktop,production" -ldflags "-H windowsgui -s -w" -o cf-quicktunnel-desktop.exe .
          echo "Built: cf-quicktunnel-desktop.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: cf-quicktunnel-desktop.exe
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-server, build-desktop]
    if: inputs.create_release
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          find artifacts -type f -name "cf-quicktunnel-*" -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
